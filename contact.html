<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOOPY — Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">LOOPY<span>🍦</span></a>
  <button class="menu-toggle">☰</button>
  <nav>
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="work.html">Work</a>
    <a href="process.html">Process</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>

<main>

<section class="contact-hero">
  <div>
    <p class="eyebrow">05 / SAY HELLO</p>
    <h1>Let's make<br><span>something</span><br>sweet.</h1>
  </div>
  <div class="contact-emoji">🍦</div>
</section>

<section class="contact-section section">

  <div class="contact-info">
    <p class="eyebrow">GET IN TOUCH</p>
    <h2>Have an idea?<br>We'd love to hear it.</h2>

    <a href="mailto:hello@loopyicecream.com" class="big-email">
      hello@loopyicecream.com ↗
    </a>

    <div class="socials">
      <a href="#">Instagram</a>
      <a href="#">TikTok</a>
      <a href="#">Facebook</a>
    </div>
  </div>

  <form class="contact-form" id="contactForm">

    <label>
      Your name
      <input type="text" placeholder="What's your name?" required>
    </label>

    <label>
      Email
      <input type="email" placeholder="you@email.com" required>
    </label>

    <label>
      What can we make?
      <select required>
        <option value="">Choose one</option>
        <option>Signature Flavor</option>
        <option>Pop-up Ice Cream</option>
        <option>Brand Collaboration</option>
        <option>Sweet Event</option>
      </select>
    </label>

    <label>
      Tell us more
      <textarea rows="5" placeholder="Tell us about your sweet idea..."></textarea>
    </label>

    <button class="btn btn-dark" type="submit">
      Send it! 🍦
    </button>

    <p class="form-message" id="formMessage"></p>

  </form>

</section>

<section class="contact-bottom">
  <div class="floating-scoop">🍨</div>
  <h2>Good things<br>come in scoops.</h2>
</section>

</main>

<footer>
  <div class="logo">LOOPY<span>🍦</span></div>
  <p>Made with cream & chaos.</p>
  <p>© 2026 LOOPY ICE CREAM</p>
</footer>

<script src="script.js"></script>
</body>
</html>
